<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile - Journey</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../assets/css/variables.css">
    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="stylesheet" href="../assets/css/components.css">
    <link rel="stylesheet" href="../assets/css/profile.css">
    <link rel="stylesheet" href="../assets/css/navbar.css">
    <script>
        const savedTheme = localStorage.getItem('theme');
        const isExplore = window.location.pathname.endsWith('explore.html');
        if (savedTheme === 'dark' && !isExplore) {
            document.documentElement.setAttribute('data-theme', 'dark');
        }
    </script>
</head>
<body class="profile-page">
    <div class="app-shell">
        <!-- Header Profile -->
        <section class="profile-header-section">
            <img src="../assets/images/user-icon.jpg" alt="Profile" class="profile-avatar-large">
            <h1 class="profile-name">Bang Pragaza</h1>
            <span class="profile-role">Teknik Informatika</span>
        </section>

        <div class="section-header" style="margin-bottom: 12px; padding: 0 var(--page-gutter);">
            <h3 style="font-size: 16px;">Akun</h3>
        </div>

        <!-- Group Akun -->
        <div class="settings-group">
            <a href="#" class="settings-item">
                <div class="settings-item-left">
                    <div class="settings-icon"><i class="fa-regular fa-user"></i></div>
                    Edit Profil
                </div>
                <div class="settings-item-right"><i class="fa-solid fa-chevron-right"></i></div>
            </a>
            <a href="#" class="settings-item">
                <div class="settings-item-left">
                    <div class="settings-icon"><i class="fa-solid fa-shield-halved"></i></div>
                    Keamanan
                </div>
                <div class="settings-item-right"><i class="fa-solid fa-chevron-right"></i></div>
            </a>
            <!-- MENU BAHASA (Pop-Up) -->
            <a href="#" class="settings-item" id="lang-btn">
                <div class="settings-item-left">
                    <div class="settings-icon" style="color: #0ea5e9; background: rgba(14, 165, 233, 0.1);"><i class="fa-solid fa-globe"></i></div>
                    Bahasa / Language
                </div>
                <div class="settings-item-right"><i class="fa-solid fa-chevron-right"></i></div>
            </a>
        </div>

        <div class="section-header" style="margin-bottom: 12px; padding: 0 var(--page-gutter);">
            <h3 style="font-size: 16px;">Preferensi</h3>
        </div>

        <!-- Group Preferensi (Dark Mode) -->
        <div class="settings-group">
            <div class="settings-item">
                <div class="settings-item-left">
                    <div class="settings-icon" style="color: #6366f1; background: rgba(99, 102, 241, 0.1);"><i class="fa-solid fa-moon"></i></div>
                    Dark Mode
                </div>
                <div class="settings-item-right">
                    <label class="theme-switch">
                        <input type="checkbox" id="darkModeToggle">
                        <span class="slider"></span>
                    </label>
                </div>
            </div>
            <a href="#" class="settings-item">
                <div class="settings-item-left">
                    <div class="settings-icon" style="color: #f59e0b; background: rgba(245, 158, 11, 0.1);"><i class="fa-regular fa-bell"></i></div>
                    Notifikasi
                </div>
                <div class="settings-item-right"><i class="fa-solid fa-chevron-right"></i></div>
            </a>
        </div>

        <!-- Logout -->
        <a href="login.html" class="btn-logout">
            <i class="fa-solid fa-arrow-right-from-bracket"></i> Keluar Akun
        </a>
    </div>

    <!-- ==========================================
         MODAL POP-UP BAHASA (PREMIUM CUSTOM UI)
         ========================================== -->
    <div class="modal-overlay" id="lang-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Pilih Bahasa</h3>
                <button class="close-modal" id="close-lang"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <p style="font-size: 12px; color: var(--text-muted); margin-bottom: 4px;">Pilih bahasa tampilan aplikasi.</p>
            
            <!-- List Pilihan Bahasa Premium Custom -->
            <div class="lang-list">
                <!-- Indonesia -->
                <div class="lang-option active" data-lang="id" onclick="changeAppLanguage('id')">
                    <div class="lang-option-left">
                        <span class="lang-flag">🇮🇩</span>
                        <div class="lang-name">
                            Bahasa Indonesia
                            <span>Indonesian</span>
                        </div>
                    </div>
                    <i class="fa-solid fa-circle-check lang-check"></i>
                </div>
                <!-- Inggris -->
                <div class="lang-option" data-lang="en" onclick="changeAppLanguage('en')">
                    <div class="lang-option-left">
                        <span class="lang-flag">🇬🇧</span>
                        <div class="lang-name">
                            English
                            <span>English</span>
                        </div>
                    </div>
                    <i class="fa-solid fa-circle-check lang-check"></i>
                </div>
                <!-- Jepang -->
                <div class="lang-option" data-lang="ja" onclick="changeAppLanguage('ja')">
                    <div class="lang-option-left">
                        <span class="lang-flag">🇯🇵</span>
                        <div class="lang-name">
                            日本語
                            <span>Japanese</span>
                        </div>
                    </div>
                    <i class="fa-solid fa-circle-check lang-check"></i>
                </div>
            </div>
        </div>
    </div>

   <div id="google_translate_element"></div>

    <script src="../assets/js/translate.js"></script>
    <div id="bottom-nav-container"></div>
    <script src="../assets/js/navbar.js"></script>
    <script src="../assets/js/script.js"></script>

    <!-- JS BUKA TUTUP MODAL & SELEKTOR AKTIF -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const langBtn = document.getElementById('lang-btn');
            const langModal = document.getElementById('lang-modal');
            const closeLangBtn = document.getElementById('close-lang');

            langBtn.addEventListener('click', (e) => {
                e.preventDefault();
                langModal.classList.add('active');
            });

            closeLangBtn.addEventListener('click', () => {
                langModal.classList.remove('active');
            });

            langModal.addEventListener('click', (e) => {
                if(e.target === langModal) {
                    langModal.classList.remove('active');
                }
            });

            // Tutup modal otomatis kalau sudah memilih bahasa
            document.querySelectorAll('.lang-option').forEach(opt => {
                opt.addEventListener('click', () => {
                    setTimeout(() => langModal.classList.remove('active'), 250);
                });
            });
        });
    </script>
</body>
</html>
